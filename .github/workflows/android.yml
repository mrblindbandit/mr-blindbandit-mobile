name: Build and test Android app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle -p Android testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle -p Android lintDebug --stacktrace
      - name: Build debug APK
        run: gradle -p Android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Blindbandit-Android-1.3-debug-APK
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blindbandit-Android-lint-report
          path: Android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
