name: iOS TestFlight upload
on:
  push:
    branches: [fix/ios-connection-45]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
    steps:
      - name: Check App Store Connect secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          swift scripts/GenerateAppIcon.swift
          xcodegen generate
      - name: Build and test before uploading
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x.get("isAvailable") and x.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          xcodebuild test -project Blindbandit.xcodeproj -scheme Blindbandit \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:BlindbanditTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Archive and upload with fastlane (API key JWT, no Xcode account)
        run: fastlane beta
