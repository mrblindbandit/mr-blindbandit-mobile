name: iOS CI — Mr. Blindbandit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_VERSION: '1.6'
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and app icon
        run: |
          swift scripts/GenerateAppIcon.swift
          xcodegen generate
      - name: Verify iOS release version
        run: |
          grep -q "MARKETING_VERSION: '1.6'" project.yml
          grep -q "CURRENT_PROJECT_VERSION: '6'" project.yml
          test -f App/PrivacyInfo.xcprivacy
          grep -q 'com.apple.developer.applesignin' App/Blindbandit.entitlements
      - name: Run iOS unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for values in d.values() for x in values if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          xcodebuild test -project Blindbandit.xcodeproj -scheme Blindbandit -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build unsigned IPA
        run: bash build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mr-Blindbandit-iOS-v1.6-unsigned-IPA
          path: dist/Mr-Blindbandit-iOS-v1.6-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
