name: Build unsigned iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Blindbandit-unsigned-IPA
          path: build/Blindbandit-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
