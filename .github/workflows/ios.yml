name: Build and test iPhone app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and app icon
        run: |
          swift scripts/GenerateAppIcon.swift
          xcodegen generate
      - name: Run iOS unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for values in d.values() for x in values if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          xcodebuild test -project Blindbandit.xcodeproj -scheme Blindbandit -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build unsigned IPA
        run: bash build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Blindbandit-iOS-1.3-unsigned-IPA
          path: build/Blindbandit-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
