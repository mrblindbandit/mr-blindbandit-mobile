org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Clerk 1.0.33 AAR requires compileSdk 36; AGP 8.9+ needs Gradle 8.11+ but CI pins Gradle 8.9.
android.suppressUnsupportedCompileSdk=36

# Kotlin 2.4 warns on Gradle 8.9; CI pins 8.9 (AGP 8.7.3).
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
