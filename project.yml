name: Blindbandit
options:
  bundleIdPrefix: net.mrblindbandit
  deploymentTarget:
    iOS: '17.0'
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.17.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Blindbandit:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.privateapp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/Blindbandit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mr. Blindbandit
        INFOPLIST_KEY_CFBundleName: Mr. Blindbandit
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock Mr. Blindbandit using Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Allow Mr. Blindbandit to use the camera for video calls, creator tools, profile media, and uploads you choose to make.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Allow Mr. Blindbandit to use the microphone for voice and video calls, recording, and creator tools you choose to use.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Allow Mr. Blindbandit to choose photos and videos for creator tools and uploads you start.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Allow Mr. Blindbandit to save media you explicitly export to Photos.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.4'
        CURRENT_PROJECT_VERSION: '4'
  BlindbanditTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Blindbandit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Blindbandit:
    build:
      targets:
        Blindbandit: all
        BlindbanditTests: [test]
    test:
      targets:
        - BlindbanditTests
