name: Blindbandit
options:
  bundleIdPrefix: net.mrblindbandit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
packages:
  LiveKitClient:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.6.0
  Clerk:
    url: https://github.com/clerk/clerk-ios
    # 1.2.0+ needs Swift tools 6.2; Xcode 16.4 CI cannot resolve. Last 5.10-compatible release:
    exactVersion: 1.1.5
targets:
  Blindbandit:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.example"
          - "**/Secrets.local.swift.example"
      - path: App/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.privateapp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/Blindbandit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store name is "Mr. BlindBandit Mobile" (set in App Store Connect). The Home Screen label
        # is shorter because iOS truncates labels longer than about 12 characters.
        INFOPLIST_KEY_CFBundleDisplayName: BlindBandit
        INFOPLIST_KEY_CFBundleName: BlindBandit
        INFOPLIST_KEY_NSFaceIDUsageDescription: Mr. BlindBandit Mobile uses Face ID to unlock the app. You can turn the app lock off in Settings.
        INFOPLIST_KEY_NSCameraUsageDescription: Mr. BlindBandit Mobile uses the camera only when you start or join a video call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Mr. BlindBandit Mobile uses the microphone for voice and video calls and for recordings you start in the creator tools.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.7'
        CURRENT_PROJECT_VERSION: '7'
    dependencies:
      - package: LiveKitClient
        product: LiveKit
      - package: Clerk
        product: ClerkKit
  BlindbanditTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Blindbandit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Blindbandit:
    build:
      targets:
        Blindbandit: all
        BlindbanditTests: [test]
    test:
      targets:
        - BlindbanditTests
