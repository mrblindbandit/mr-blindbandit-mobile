name: Blindbandit
options:
  bundleIdPrefix: net.mrblindbandit
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    # Single source of truth for every target (app + all extensions + watch). Bump here only.
    MARKETING_VERSION: '2.2.0'
    CURRENT_PROJECT_VERSION: '42'
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
packages:
  LiveKitClient:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.6.0
  AgoraRtcEngine_iOS:
    url: https://github.com/AgoraIO/AgoraRtcEngine_iOS
    from: 4.5.0
  Clerk:
    url: https://github.com/clerk/clerk-ios
    # 1.2.0+ needs Swift tools 6.2; Xcode 16.4 CI cannot resolve. Last 5.10-compatible release:
    exactVersion: 1.1.5
targets:
  Blindbandit:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.example"
          - "**/Secrets.local.swift.example"
          - "Info.plist"
      - path: Shared
        excludes:
          # ActivityKit types — widgets-only until LA extension is re-embedded (ASC Invalid Binary otherwise).
          - CallActivityAttributes.swift
      - path: App/Resources
        buildPhase: resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: net.mrblindbandit.app
            CFBundleURLSchemes: [mrblindbandit, blindbandit]
        # CallKit: incoming calls arrive as PushKit VoIP pushes; Recents/Siri redial via INStartCallIntent.
        UIBackgroundModes: [audio, remote-notification, voip]
        NSUserActivityTypes: [INStartCallIntent, INSendMessageIntent, net.mrblindbandit.app.handoff.chat, net.mrblindbandit.app.handoff.ai, net.mrblindbandit.app.handoff.bites]
        # NSSupportsLiveActivities*: omit until BlindbanditWidgets is re-embedded (Apple rejects LA without WidgetKit extension).
        NSAppleMusicUsageDescription: The AI can play, search and queue Apple Music and your library inside Mr. BlindBandit when you ask it to.
        BBKeychainGroup: $(AppIdentifierPrefix)net.mrblindbandit.shared
        RTCAppGroupIdentifier: group.net.mrblindbandit.app
        RTCScreenSharingExtension: net.mrblindbandit.app.ScreenShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.app
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Blindbandit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store name is "Mr. BlindBandit Mobile" (set in App Store Connect). The Home Screen label
        # is shorter because iOS truncates labels longer than about 12 characters.
        INFOPLIST_KEY_CFBundleDisplayName: Blind Bandit
        INFOPLIST_KEY_CFBundleName: BlindBandit
        INFOPLIST_KEY_NSFaceIDUsageDescription: Mr. BlindBandit Mobile uses Face ID to unlock the app. You can turn the app lock off in Settings.
        INFOPLIST_KEY_NSCameraUsageDescription: Mr. BlindBandit Mobile uses the camera for video calls, scanning safety number QR codes and describing what your camera sees, on this iPhone only.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Mr. BlindBandit Mobile uses your photo library so you can set a public profile picture and save chat media you choose to keep.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Mr. BlindBandit Mobile saves photos and videos to your library only when you turn on Save media to Photos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Mr. BlindBandit Mobile uses the microphone for calls, voice messages, dictation and recordings you start in the creator tools.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Mr. BlindBandit Mobile turns voice messages and dictation into text on this iPhone. Audio is never sent to a server.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Mr. BlindBandit Mobile adds reminders you ask the AI chat or a message action to create.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Mr. BlindBandit Mobile lets the AI chat check your calendar when you ask what is coming up. Nothing leaves your iPhone.
        INFOPLIST_KEY_NSContactsUsageDescription: Mr. BlindBandit Mobile lets the AI chat look up a contact when you ask, on this iPhone only.
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: Mr. BlindBandit Mobile sends notifications for incoming calls and new messages. You can turn them off in Settings.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIBackgroundModes: [audio, remote-notification, voip]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: LiveKitClient
        product: LiveKit
      - package: AgoraRtcEngine_iOS
        product: RtcBasic
      - package: Clerk
        product: ClerkKit
      - target: ScreenShare
        embed: true
      - target: NotificationService
        embed: true
      # BlindbanditWidgets / BlindbanditWatch: source kept; embed after ASC App IDs + Fastfile sigh
  BlindbanditWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/BlindbanditWidgets
        excludes: [Info.plist]
      - path: Shared
    info:
      path: Widgets/BlindbanditWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Blind Bandit Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.app.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/BlindbanditWidgets/BlindbanditWidgets.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/BlindbanditWidgets/Info.plist
  BlindbanditWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp/BlindbanditWatch
        excludes: [Info.plist]
    info:
      path: WatchApp/BlindbanditWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Blind Bandit
        WKCompanionAppBundleIdentifier: net.mrblindbandit.app
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: WatchApp/BlindbanditWatch/BlindbanditWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WatchApp/BlindbanditWatch/Info.plist
        SDKROOT: watchos
  ScreenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenShare
        excludes: [Info.plist]
    info:
      path: ScreenShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Mr. BlindBandit
        RTCAppGroupIdentifier: group.net.mrblindbandit.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.app.ScreenShare
        CODE_SIGN_ENTITLEMENTS: ScreenShare/ScreenShare.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: LiveKitClient
        product: LiveKit
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: [Info.plist]
      - App/Security/E2EECrypto.swift
      - App/Security/E2EEEnvelope.swift
      - App/Security/MessageCrypto.swift
      - App/Security/IdentityStore.swift
      - App/Security/Keychain.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Mr. BlindBandit Notifications
        BBKeychainGroup: $(AppIdentifierPrefix)net.mrblindbandit.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.app.NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        TARGETED_DEVICE_FAMILY: '1'
  BlindbanditTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Blindbandit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BlindbanditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: Blindbandit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  Blindbandit:
    build:
      targets:
        Blindbandit: all
        BlindbanditTests: [test]
        BlindbanditUITests: [test]
    test:
      targets:
        - BlindbanditTests
        - BlindbanditUITests
