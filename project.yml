name: Blindbandit
options:
  bundleIdPrefix: net.mrblindbandit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Blindbandit:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrblindbandit.privateapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blindbandit
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your private Blindbandit app using Face ID.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  Blindbandit:
    build:
      targets:
        Blindbandit: all
